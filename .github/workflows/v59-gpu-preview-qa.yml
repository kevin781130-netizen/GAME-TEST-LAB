name: V59.7 GPU Preview WebGL QA
on:
  push:
    branches: [main]
    paths:
      - 'outrun-taipei-v59-gpu-preview/**'
      - '.github/workflows/v59-gpu-preview-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-gpu-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and CJK fonts
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify exact deployed Pages build and WebGL branch handoffs
        run: node outrun-taipei-v59-gpu-preview/qa/live-pages-webgl.cjs
      - name: Archive page screenshots and frame-timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v59-gpu-preview-qa
          path: test-results/v59-gpu-preview/
          retention-days: 14
          if-no-files-found: warn
