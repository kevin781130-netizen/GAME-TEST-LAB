name: V59 Deployed WebGL Preview QA
on:
  pull_request:
    paths:
      - 'outrun-taipei-v59-handoff-preview/qa/**'
      - '.github/workflows/v59-handoff-live-qa.yml'
  push:
    branches: [main]
    paths:
      - 'outrun-taipei-v59-handoff-preview/**'
      - '.github/workflows/v59-handoff-live-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and CJK fonts
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify live Pages WebGL preview and collect RAF timings
        run: node outrun-taipei-v59-handoff-preview/qa/live-pages-webgl.cjs
      - name: Retain screenshots and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v59-preview-qa
          path: test-results/v59-live-preview/
          retention-days: 14
          if-no-files-found: warn
