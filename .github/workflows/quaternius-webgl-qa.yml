name: Quaternius Cloud WebGL Visual QA
on:
  push:
    branches: [main]
    paths:
      - 'outrun-taipei-quaternius/**'
      - '.github/workflows/quaternius-webgl-qa.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'
permissions:
  contents: read
concurrency:
  group: quaternius-visual-qa
  cancel-in-progress: true
jobs:
  render-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Pages content (read only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tools
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Run actual Chrome/WebGL art-toggle smoke tests and save screenshots
        run: node outrun-taipei-quaternius/visual-qa.cjs
      - name: Save screenshots and machine-readable QA even if test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quaternius-webgl-visual-${{ github.sha }}
          path: test-results/quaternius-race-visual/
          if-no-files-found: warn
          retention-days: 14
